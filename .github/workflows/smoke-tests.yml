name: Playwright smoke tests

run-name: >-
  Playwright smoke tests${{ inputs.trigger_id && format(' · {0}', inputs.trigger_id) || '' }}

on:
  # Called by another workflow in this repository (see after-production-deploy.yml).
  workflow_call:
    inputs:
      frontend_url:
        description: 'Optional frontend URL override (otherwise SMOKE_TEST_BASE_URL is used)'
        required: false
        default: ''
        type: string
      trigger_id:
        description: 'Free-form marker shown in the run name so a caller can find this run'
        required: false
        default: ''
        type: string
  # Dispatched by hand, and by the tikko-backend deploy via CROSS_REPO_PAT.
  workflow_dispatch:
    inputs:
      frontend_url:
        description: 'Optional frontend URL override (otherwise SMOKE_TEST_BASE_URL is used)'
        required: false
        default: ''
        type: string
      trigger_id:
        description: 'Free-form marker shown in the run name so a caller can find this run'
        required: false
        default: ''
        type: string
  schedule:
    # 06:00 America/Sao_Paulo — production payments are exercised daily even
    # when nothing is deployed, so a broken external dependency (Mercado Pago,
    # e-mail, webhooks) surfaces before the next deploy blames itself for it.
    - cron: '0 9 * * *'

permissions:
  contents: read

# Deliberately no `concurrency` group. Overlapping runs are safe — every buyer
# address is derived from GITHUB_RUN_ID, so two runs never share a participation
# — and serializing them is not: GitHub keeps a single pending run per group, so
# a backend deploy waiting on its dispatched run watched it get cancelled the
# moment a frontend deploy queued another. A deploy gate must not go red because
# another deploy happened.

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Browsers and their system libraries ship inside the image, so there is no
    # `playwright install` download on any run. Keep the tag in lockstep with
    # @playwright/test in package-lock.json — PLAYWRIGHT_VERSION below is the
    # same number and the "Verify Playwright image" step fails the run if the
    # two ever drift (the `container.image` field cannot read the env context).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # 1001 is `pwuser` in the image: Chromium must not run as root, and
      # --ipc=host avoids the shared-memory crashes Chromium hits in Docker.
      options: --user 1001 --ipc=host

    env:
      CI: true
      PLAYWRIGHT_VERSION: 1.62.1
      # $HOME inside a container job is not reliably writable for uid 1001;
      # keep npm's cache in the workspace, which the checkout owns.
      npm_config_cache: ${{ github.workspace }}/.npm-cache

      SMOKE_TEST_BASE_URL: ${{ inputs.frontend_url || secrets.SMOKE_TEST_BASE_URL || vars.SMOKE_TEST_BASE_URL || 'http://127.0.0.1:4173' }}
      VITE_API_BASE_URL: ${{ secrets.SMOKE_TEST_API_BASE_URL || vars.SMOKE_TEST_API_BASE_URL }}
      SMOKE_TEST_API_BASE_URL: ${{ secrets.SMOKE_TEST_API_BASE_URL || vars.SMOKE_TEST_API_BASE_URL }}
      SMOKE_TEST_EVENT_SLUG: ${{ secrets.SMOKE_TEST_EVENT_SLUG || vars.SMOKE_TEST_EVENT_SLUG }}
      SMOKE_TEST_EVENT_ID: ${{ secrets.SMOKE_TEST_EVENT_ID || vars.SMOKE_TEST_EVENT_ID }}
      SMOKE_TEST_TICKET_PRICING_ID: ${{ secrets.SMOKE_TEST_TICKET_PRICING_ID || vars.SMOKE_TEST_TICKET_PRICING_ID }}
      SMOKE_TEST_MANUAL_APPROVAL_EVENT_SLUG: ${{ secrets.SMOKE_TEST_MANUAL_APPROVAL_EVENT_SLUG || vars.SMOKE_TEST_MANUAL_APPROVAL_EVENT_SLUG }}
      SMOKE_TEST_MANUAL_APPROVAL_EVENT_ID: ${{ secrets.SMOKE_TEST_MANUAL_APPROVAL_EVENT_ID || vars.SMOKE_TEST_MANUAL_APPROVAL_EVENT_ID }}
      SMOKE_TEST_MANUAL_APPROVAL_TICKET_PRICING_ID: ${{ secrets.SMOKE_TEST_MANUAL_APPROVAL_TICKET_PRICING_ID || vars.SMOKE_TEST_MANUAL_APPROVAL_TICKET_PRICING_ID }}
      SMOKE_TEST_COUPON_CODE: ${{ secrets.SMOKE_TEST_COUPON_CODE || vars.SMOKE_TEST_COUPON_CODE }}
      SMOKE_TEST_CLEANUP_URL: ${{ secrets.SMOKE_TEST_CLEANUP_URL || vars.SMOKE_TEST_CLEANUP_URL }}
      # Shared secret for the cleanup endpoint. Secret only — it is what stands
      # between a public URL and a delete in production.
      SMOKE_TEST_CLEANUP_TOKEN: ${{ secrets.SMOKE_TEST_CLEANUP_TOKEN }}
      SMOKE_TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL || vars.SMOKE_TEST_USER_EMAIL }}
      SMOKE_TEST_USER_PASSWORD: ${{ secrets.SMOKE_TEST_USER_PASSWORD }}
      SMOKE_TEST_USER_PHONE: ${{ secrets.SMOKE_TEST_USER_PHONE || vars.SMOKE_TEST_USER_PHONE }}
      SMOKE_TEST_USER_IDENTIFICATION: ${{ secrets.SMOKE_TEST_USER_IDENTIFICATION || vars.SMOKE_TEST_USER_IDENTIFICATION }}
      SMOKE_TEST_USER_BIRTHDATE: ${{ secrets.SMOKE_TEST_USER_BIRTHDATE || vars.SMOKE_TEST_USER_BIRTHDATE }}

      # Organizer session (TC-06/07/08/09). This is the admin account that owns
      # the `is_test` organization; it must never be the buyer account, since a
      # buyer is created by the checkout and has no password at all.
      SMOKE_TEST_ADMIN_EMAIL: ${{ secrets.SMOKE_TEST_ADMIN_EMAIL || vars.SMOKE_TEST_ADMIN_EMAIL }}
      SMOKE_TEST_ADMIN_PASSWORD: ${{ secrets.SMOKE_TEST_ADMIN_PASSWORD }}
      SMOKE_TEST_ORGANIZER_EMAIL: ${{ secrets.SMOKE_TEST_ORGANIZER_EMAIL || vars.SMOKE_TEST_ORGANIZER_EMAIL }}
      SMOKE_TEST_ORGANIZER_PASSWORD: ${{ secrets.SMOKE_TEST_ORGANIZER_PASSWORD }}

      # Mercado Pago decides the sandbox result from the *cardholder name*, so
      # one card drives APRO, OTHE, CONT, CALL, FUND, SECU, EXPI and FORM.
      # Public sandbox card; repository secrets override it. Visa, not the
      # Mastercard sandbox card: payment_methods/search returns no issuer for
      # BIN 503143 on this test account, so tokenization failed with
      # ISSUER_NOT_FOUND. BIN 423564 resolves to issuer 25 / "visa".
      SMOKE_TEST_MP_APPROVED_NUMBER: ${{ secrets.SMOKE_TEST_MP_APPROVED_NUMBER || '4235647728025682' }}
      SMOKE_TEST_MP_APPROVED_SECURITY_CODE: ${{ secrets.SMOKE_TEST_MP_APPROVED_SECURITY_CODE || '123' }}
      SMOKE_TEST_MP_APPROVED_IDENTIFICATION: ${{ secrets.SMOKE_TEST_MP_APPROVED_IDENTIFICATION || vars.SMOKE_TEST_MP_APPROVED_IDENTIFICATION }}
      SMOKE_TEST_MP_CARD_EXPIRATION_MONTH: ${{ secrets.SMOKE_TEST_MP_CARD_EXPIRATION_MONTH || vars.SMOKE_TEST_MP_CARD_EXPIRATION_MONTH || '11' }}
      SMOKE_TEST_MP_CARD_EXPIRATION_YEAR: ${{ secrets.SMOKE_TEST_MP_CARD_EXPIRATION_YEAR || vars.SMOKE_TEST_MP_CARD_EXPIRATION_YEAR || '30' }}

      # Brand matrix (TC-05). These come from the private Mercado Pago fixture
      # and have no in-repo default on purpose — without the secrets the brand
      # cases report themselves as skipped instead of passing silently.
      SMOKE_TEST_MP_MASTERCARD_NUMBER: ${{ secrets.SMOKE_TEST_MP_MASTERCARD_NUMBER }}
      SMOKE_TEST_MP_MASTERCARD_SECURITY_CODE: ${{ secrets.SMOKE_TEST_MP_MASTERCARD_SECURITY_CODE }}
      SMOKE_TEST_MP_VISA_NUMBER: ${{ secrets.SMOKE_TEST_MP_VISA_NUMBER }}
      SMOKE_TEST_MP_VISA_SECURITY_CODE: ${{ secrets.SMOKE_TEST_MP_VISA_SECURITY_CODE }}
      SMOKE_TEST_MP_AMEX_NUMBER: ${{ secrets.SMOKE_TEST_MP_AMEX_NUMBER }}
      SMOKE_TEST_MP_AMEX_SECURITY_CODE: ${{ secrets.SMOKE_TEST_MP_AMEX_SECURITY_CODE }}
      SMOKE_TEST_MP_ELO_DEBIT_NUMBER: ${{ secrets.SMOKE_TEST_MP_ELO_DEBIT_NUMBER }}
      SMOKE_TEST_MP_ELO_DEBIT_SECURITY_CODE: ${{ secrets.SMOKE_TEST_MP_ELO_DEBIT_SECURITY_CODE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright image matches the lockfile
        shell: bash
        run: |
          locked="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [ "$locked" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::package-lock.json pins @playwright/test $locked but this job runs mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION-noble. Bump the container image tag and PLAYWRIGHT_VERSION in this workflow together."
            exit 1
          fi
          echo "Playwright $locked, browsers preinstalled at ${PLAYWRIGHT_BROWSERS_PATH:-<image default>}"

      - name: Run smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e -- e2e/ 2>&1 | tee smoke-test.log

      - name: Report skipped cases
        if: always()
        shell: bash
        run: |
          if grep -qE '[0-9]+ skipped' smoke-test.log; then
            echo "::warning::Some smoke cases were skipped — see the run log for which fixture secrets are missing."
            grep -n 'was not exercised' smoke-test.log || true
          fi

      - name: Upload smoke report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            smoke-test.log
            playwright-report/
            test-results/
          retention-days: 14
